spring.application.name=chat-api
server.port=${SERVER_PORT:8080}

# Own database (users & conversations only; messages live in message-server)
spring.datasource.url=${DB_URL:jdbc:h2:mem:chatdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# gRPC client -> message-server
grpc.client.message-server.address=${MESSAGE_SERVER_ADDRESS:static://localhost:9090}
grpc.client.message-server.negotiation-type=plaintext
grpc.client.message-server.deadline=5s

# OpenAPI / Swagger UI available at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.fr.efrei.messaging=DEBUG

# Validation messages always in English
spring.web.locale=en
spring.web.locale-resolver=fixed
