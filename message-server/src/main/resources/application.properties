spring.application.name=message-server

# gRPC server (no HTTP server in this service)
grpc.server.port=${GRPC_PORT:9090}
spring.main.web-application-type=none

# Own database (messages only)
spring.datasource.url=${DB_URL:jdbc:h2:mem:messagesdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.level.fr.efrei.messaging=DEBUG
